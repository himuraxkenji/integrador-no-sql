services:
  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4
    # AOF activado: comportamiento definido ante reinicios.
    # Sin esto, un reinicio de Redis pierde contadores e historial de vistas
    # (la caché sí se puede perder sin drama; los contadores quizás no).
    # Discutan en docs/decisions.md qué consecuencias tiene para su diseño.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    environment:
      # Credencial de desarrollo local; se puede cambiar desde .env.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexus-dev-password}
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser
      - "127.0.0.1:7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    ports: ["8000:8000"]
    environment:
      ADAPTERS: ${ADAPTERS:-real}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-nexus}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-dev-password}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      # Demo de caché: el MISS tarda este tiempo a propósito (0 = sin retardo; usar 0 para correr los tests)
      CACHE_MISS_DELAY_SECONDS: ${CACHE_MISS_DELAY_SECONDS:-5}
      RECENT_VIEWS_LIMIT: ${RECENT_VIEWS_LIMIT:-10}
    # Desarrollo: el bind mount pisa el código de la imagen y --reload toma los cambios al guardar.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    volumes:
      - .:/app
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  # --- Clientes de base de datos (opcionales: perfil "clients") ---
  # No arrancan con `docker compose up`; se levantan con `make clients`.
  # Solo para desarrollo local: sin autenticación y atados a las bases del compose.
  # Todos los puertos de bases y clientes se publican solo en 127.0.0.1 (no quedan expuestos en la red).
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    profiles: ["clients"]
    ports: ["127.0.0.1:8081:8081"] # http://localhost:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false" # desarrollo local: sin usuario/clave
    depends_on:
      mongo: { condition: service_healthy }

  redisinsight:
    image: redis/redisinsight:3.8.0
    profiles: ["clients"]
    ports: ["127.0.0.1:5540:5540"] # http://localhost:5540
    environment:
      # Conexión preconfigurada: aparece en la lista sin configurar nada a mano.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: nexus-redis
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_ANALYTICS_OPT_OUT: "true"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis: { condition: service_healthy }

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  redisinsight_data:
