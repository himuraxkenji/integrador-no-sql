[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - TP integrador NoSQL (MongoDB + Redis + Neo4j)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "redis>=5.2",
    "neo4j>=5.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
# No es un paquete instalable: es una aplicación que se corre desde la raíz del repo.
package = false

[tool.pyright]
# Para el LSP del editor (Pyright/Pylance): usa el venv de uv y Python 3.12,
# así "ir a definición" resuelve también fastapi, pydantic y los drivers.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "acceptance: prueba de aceptación contra la API corriendo (NEXUS_BASE_URL)",
]
